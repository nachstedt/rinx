[package]
name = "rusty-sphinx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
html-escape = "0.2.13"
minijinja = "2"
pathdiff = "0.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
toml = "0.8"

[lints.clippy]
pedantic = "warn"

[lints.rust]
unsafe_code = "forbid"
