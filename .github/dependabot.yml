version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A Cargo change also needs `CARGO_BAZEL_REPIN=1` to refresh
    # Cargo.bazel.lock, which Dependabot cannot do; grouping keeps that to one
    # pull request a week.
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    # @types/node describes the Node inside VS Code's Electron, not the latest
    # Node, so its major is raised by hand. A bump of @types/vscode likewise
    # needs `engines.vscode` in package.json raised to match.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # A bump also needs scripts/requirements.txt regenerated (the `uv export`
    # in docs/dev/python.md), which Dependabot cannot do; the `python` CI job
    # fails with a diff until it is.
    groups:
      uv:
        patterns: ["*"]
