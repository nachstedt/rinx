# Opens the pull request adding a release to the Bazel Central Registry.
#
# Called by release.yaml; can also be run by hand from the Actions tab to retry
# a release whose registry step failed.
name: Publish to BCR

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      # The same name as the repository secret, so both triggers read it alike.
      BCR_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: The git tag being released, e.g. v0.1.0
        required: true
        type: string

permissions: {}

jobs:
  publish:
    # https://github.com/bazel-contrib/publish-to-bcr/blob/main/.github/workflows/publish.yaml
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.1
    with:
      tag_name: ${{ inputs.tag_name }}
      registry_fork: nachstedt/bazel-central-registry
      # A personal account's token opens the pull request, so it starts as a
      # draft: marking it ready for review is how the maintainer approves it.
      draft: true
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
