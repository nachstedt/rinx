# Builds rinx's documentation and example site with rinx, and publishes them to
# the gh-pages branch GitHub Pages serves, as one version beside the others
# (docs/decisions/024-versioned-docs.md):
#
#   main/     after CI has succeeded on main, so a commit that fails CI is
#             never published
#   vX.Y.Z/   called by release.yaml once a release is final, or run by hand
#             with a tag to publish (or, with force, republish) an older one
#
# Each version holds //docs:site at its root, //examples:site under
# example-site/, and the benchmark sites (benchmarks.yml) under benchmarks/;
# scripts/publish_pages.py regenerates latest/, versions.json and the
# redirects around them, and drops a superseded release's benchmarks/.
#
# The benchmark sites are not rebuilt here when CI already rendered them for
# this commit: after CI on main they come from that run, and for a release from
# CI's job in the same run. Only a by-hand republish benchmarks afresh — and a
# tag from before they existed publishes without them.
name: Pages

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_call:
    inputs:
      version:
        description: The release tag to publish, e.g. v1.2.3.
        type: string
        required: true
      force:
        description: Replace a release that is already published.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "`main`, or a release tag such as v0.1.0."
        type: string
        required: true
        default: main
      force:
        description: Replace a release that is already published.
        type: boolean
        default: false

permissions: {}

env:
  # main after CI, otherwise the version asked for.
  VERSION: ${{ inputs.version || 'main' }}

jobs:
  benchmarks:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/benchmarks.yml
    with:
      ref: ${{ inputs.version }}
    permissions:
      contents: read

  build:
    needs: benchmarks
    # Only CI's run for a push to main: a pull request from a fork's branch
    # named main also reports head_branch "main". `!cancelled()` because the
    # benchmarks job is skipped unless run by hand, and may fail for an old tag.
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The benchmark sites CI uploaded.
      actions: read
    steps:
    - uses: actions/checkout@v7
      with:
        # The commit CI checked, not whatever main has moved on to since; or
        # the tag being published.
        ref: ${{ github.event.workflow_run.head_sha || env.VERSION }}

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        # The cache ci.yml saves on main.
        disk-cache: bazel
        repository-cache: true
        cache-save: false

    - name: Build the sites
      run: bazel build //docs:site //examples:site

    # Dereferenced, since bazel-bin is a symlink into Bazel's output base.
    - name: Collect the sites
      run: |
        mkdir -p sites/docs sites/examples
        cp -RL bazel-bin/docs/site_site_out/. sites/docs/
        cp -RL bazel-bin/examples/site_site_out/. sites/examples/

    # From CI's run on main, or from this run: CI's job in a release, or the
    # benchmarks job above. Missing only when a corpus failed to build.
    - name: Fetch the benchmark sites
      id: benchmarks
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: benchmarks
        path: sites/benchmarks
        run-id: ${{ github.event.workflow_run.id || github.run_id }}
        github-token: ${{ github.token }}

    - name: Note missing benchmark sites
      if: steps.benchmarks.outcome != 'success'
      run: echo "::warning::No benchmark sites to publish; publishing ${VERSION} without them."

    - uses: actions/upload-artifact@v7
      with:
        name: sites
        path: sites
        retention-days: 1

  # Separate from the build so that the job holding write access runs no code
  # from the commit being published — only the publisher from the default
  # branch, which also lets it publish a tag older than the script.
  publish:
    needs: build
    # Explicit, because the implicit `success()` covers every job upstream:
    # `build` needs `benchmarks`, which is skipped unless run by hand, and a
    # skipped ancestor would skip this job too — publishing nothing.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # No concurrency group: GitHub keeps one pending run per group and cancels
    # the rest, which could drop a release's publish behind a preview's. The
    # publisher retries a push that lost a race instead.
    steps:
    # A clone of the repository with push access, which the publisher turns
    # into a checkout of gh-pages.
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Keep the publisher outside the checkout it replaces
      run: cp scripts/publish_pages.py "$RUNNER_TEMP/"

    - uses: actions/download-artifact@v8
      with:
        name: sites
        path: ${{ runner.temp }}/sites

    # A run finishing after a newer commit's must not put main/ back: skip it,
    # and leave main/ to the run for main's tip.
    - name: Check the commit is still main's tip
      id: tip
      if: github.event_name == 'workflow_run'
      env:
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        tip=$(git ls-remote origin refs/heads/main | cut -f1)
        if [ "$tip" = "$HEAD_SHA" ]; then
          echo "moved-on=false" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::main has moved on to $tip; the run for that commit publishes main/."
          echo "moved-on=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish ${{ env.VERSION }}
      if: steps.tip.outputs.moved-on != 'true'
      env:
        FORCE: ${{ inputs.force && '--force' || '' }}
        BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      run: >-
        python3 "$RUNNER_TEMP/publish_pages.py" publish
        --pages-dir .
        --base-url "$BASE_URL"
        --slot "$VERSION"
        --docs "$RUNNER_TEMP/sites/docs"
        --examples "$RUNNER_TEMP/sites/examples"
        --benchmarks-dir "$RUNNER_TEMP/sites/benchmarks"
        $FORCE
