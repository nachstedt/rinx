# Every check a pull request must pass. The jobs are independent and start
# together; `ci-ok` folds their results into the one check the "main
# gatekeeper" ruleset requires, so adding a job never needs a ruleset edit.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # release.yaml runs the full CI again on the tagged commit before releasing.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; runs on main
# and on a release tag always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: Rust / lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    # Installs the toolchain rust-toolchain.toml pins, with its components.
    - name: Set up Rust
      run: rustup toolchain install --no-self-update

    # Pull requests restore main's cache but never save their own.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: lint
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy
      run: cargo clippy --workspace --tests -- -D warnings

    # The published crates are built without `--tests`, so a warning that only
    # test code silences would otherwise surface first on crates.io.
    - name: Run Clippy on non-test code
      run: cargo clippy --workspace -- -D warnings

    - name: Document
      run: cargo doc --workspace --no-deps

  rust-test:
    name: Rust / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Set up Rust
      run: rustup toolchain install --no-self-update

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: test
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Run the tests
      run: cargo test --workspace

  rust-package:
    name: Rust / package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Set up Rust
      run: rustup toolchain install --no-self-update

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: package
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # Builds every crate from the tarball crates.io would receive, so a missing
    # file or a path-only dependency fails here rather than at release time.
    - name: Package for crates.io
      run: cargo package --workspace

  # Line coverage of every crate's tests, the processes the integration tests
  # spawn included. The floors are floors, not targets: raise them as coverage
  # rises, so a change that adds untested code fails here.
  rust-coverage:
    name: Rust / coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKSPACE_FLOOR: 97
      # The language server on its own, since its roadmap adds code in every
      # step and a workspace-wide figure would hide a gap there.
      LSP_FLOOR: 98
    steps:
    - uses: actions/checkout@v7

    - name: Set up Rust
      run: |
        rustup toolchain install --no-self-update
        rustup component add llvm-tools-preview

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: coverage
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    - name: Run the tests with coverage
      run: cargo llvm-cov --workspace --no-report

    - name: Check the coverage floors
      run: |
        {
          echo '### Line coverage'
          echo '```'
          cargo llvm-cov report --summary-only | grep -E '^(Filename|TOTAL)'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        cargo llvm-cov report --summary-only --fail-under-lines "$WORKSPACE_FLOOR" > /dev/null
        lsp=$(cargo llvm-cov report --json --summary-only | jq '
          [.data[0].files[] | select(.filename | contains("/crates/lsp/")) | .summary.lines]
          | (map(.covered) | add) * 100 / (map(.count) | add)')
        echo "rinx_lsp line coverage: ${lsp}% (floor ${LSP_FLOOR}%)" | tee -a "$GITHUB_STEP_SUMMARY"
        jq -en --argjson covered "$lsp" --argjson floor "$LSP_FLOOR" '$covered >= $floor' > /dev/null

  # Every fuzz target for a minute, so the targets keep building and a crash
  # that is easy to find is found before merging. fuzz.yml runs them longer
  # every night.
  fuzz-smoke:
    name: Rust / fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fuzz
    steps:
    - uses: actions/checkout@v7

    # Installs the nightly fuzz/rust-toolchain.toml pins.
    - name: Set up Rust
      run: rustup toolchain install --no-self-update

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: fuzz
        shared-key: fuzz
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-fuzz

    # Outside the workspace, so `Rust / lint` does not see this crate.
    - name: Check formatting
      run: cargo fmt --check

    - name: Run Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Fuzz the parser
      run: ./run.sh parse 60

    - name: Fuzz the language server
      run: ./run.sh lsp_session 60

    - name: Upload the crashing inputs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-artifacts
        path: fuzz/artifacts
        retention-days: 14

  bazel:
    name: Bazel / integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        # One name for every workflow building these targets (this one, the
        # release's call of it, and pages.yml), so they share one cache.
        disk-cache: bazel
        repository-cache: true
        # Pull requests restore main's caches but never save their own.
        cache-save: ${{ github.event_name != 'pull_request' }}

    - name: Build full site (all teams)
      run: bazel build //examples:site

    - name: Build the sibling site linking into it (intersphinx)
      run: bazel build //examples/intersphinx:sibling_site

    # rinx's own documentation, built with strict_links, so a broken
    # cross-reference in it fails the pull request rather than the deployment.
    - name: Build the documentation site
      run: bazel build //docs:site

    # The pull request's preview (pages-preview.yml publishes it), uploaded
    # before the remaining checks so a failing test still leaves one to look
    # at. This job runs with the pull request's code and a read-only token, so
    # it only uploads; the number is what the publisher cross-checks against
    # the pull request's head commit before trusting it.
    - name: Collect the sites for a preview
      if: github.event_name == 'pull_request'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        mkdir -p preview/docs preview/examples
        cp -RL bazel-bin/docs/site_site_out/. preview/docs/
        cp -RL bazel-bin/examples/site_site_out/. preview/examples/
        echo "$PR_NUMBER" > preview/pr-number

    - name: Upload the preview
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: preview
        path: preview
        retention-days: 1

    - name: Run the script tests
      run: bazel test //scripts:all

    # The default theme's browser scripts, under rules_js' hermetic Node.js.
    - name: Run the theme script tests
      run: bazel test //tests/js:all

    - name: Build team_a in isolation (partial build)
      run: bazel build //examples/team_a:docs

    - name: Build team_b in isolation (partial build)
      run: bazel build //examples/team_b:docs

    # The scripts below edit files under examples/ and restore them, so they
    # must run one after another in this one checkout.
    - name: Run strict dependencies test
      run: ./tests/test_strict_deps.sh

    - name: Run strict links test
      run: ./tests/test_strict_links.sh

    - name: Run parse data test
      run: ./tests/test_parse_data.sh

    - name: Run image data test
      run: ./tests/test_image_data.sh

    - name: Run download data test
      run: ./tests/test_download_data.sh

    - name: Run Jinja templating test
      run: ./tests/test_jinja.sh

    - name: Run entity schema test
      run: ./tests/test_entity_schema.sh

    - name: Run doctest isolation test
      run: ./tests/test_doctest_isolation.sh

    - name: Run doctest failure test
      run: ./tests/test_doctest_failure.sh

    - name: Run doctest cache firewall test
      run: ./tests/test_doctest_cache_firewall.sh

    - name: Run diagram opt-in test
      run: ./tests/test_diagram_opt_in.sh

    - name: Run diagram cache firewall test
      run: ./tests/test_diagram_cache_firewall.sh

    - name: Run intersphinx test
      run: ./tests/test_intersphinx.sh

    - name: Run domain indices test
      run: ./tests/test_domain_indices.sh

    # rinx as a dependency of another module, the shape the Bazel Central
    # Registry's presubmit checks and every user has.
    - name: Build and test the smoke module
      working-directory: e2e/smoke
      run: bazel test //...

  # Both benchmark corpora, whose rendered sites the Pages workflows publish
  # next to the documentation. A corpus that stops building fails CI; new
  # warnings and timings only land in the job summary.
  benchmarks:
    name: Benchmarks
    uses: ./.github/workflows/benchmarks.yml
    permissions:
      contents: read

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    # `--locked` fails when pyproject.toml and uv.lock disagree, rather than
    # quietly resolving afresh.
    - name: Install the Python tooling
      run: uv sync --locked

    - name: Check formatting
      run: uv run ruff format --check

    - name: Lint
      run: uv run ruff check --output-format=github

    - name: Type-check
      run: uv run ty check --output-format=github

    - name: Run the script tests with coverage
      run: uv run pytest --cov

    # The runner ships to users' `py_test`s, whose interpreter may be older than
    # this repository's; see docs/dev/python.md.
    - name: Run the doctest runner's tests on its oldest supported Python
      run: >-
        uv run --isolated --no-project --python 3.9 --with pytest
        pytest -p no:cacheprovider --rootdir scripts scripts/doctest_runner_test.py

    # Bazel's `py_test`s resolve pytest from this file, generated from uv.lock.
    - name: Check the Bazel requirements lock is up to date
      run: |
        uv export --only-group test --no-emit-project --format requirements-txt \
          -o scripts/requirements.txt
        git diff --exit-code scripts/requirements.txt

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    # `npm ci` installs exactly package-lock.json, and fails when it disagrees
    # with package.json.
    - name: Install dependencies
      working-directory: editors/vscode
      run: npm ci

    - name: Run extension tests
      working-directory: editors/vscode
      run: xvfb-run -a npm test

  # The one check the ruleset requires. `always()` makes it report even when a
  # job it needs failed or was skipped, which would otherwise leave it pending
  # and the pull request blocked without a reason.
  ci-ok:
    name: CI result
    if: always()
    needs: [rust-lint, rust-test, rust-coverage, fuzz-smoke, rust-package, bazel, benchmarks, python, vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require every job to have succeeded
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
        jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null
