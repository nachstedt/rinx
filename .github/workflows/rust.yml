name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_test_lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
        
    - name: Check formatting
      run: cargo fmt -- --check
      
    - name: Run Clippy
      run: cargo clippy -- -D warnings
      
    - name: Build
      run: cargo build --verbose
      
    - name: Run unit tests
      run: cargo test --verbose
      
    - name: Document
      run: cargo doc --no-deps

  bazel_integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.9.1
      with:
        # Cache Bazel's external dependencies between CI runs
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Build full site (all teams)
      run: bazel build //examples:site

    - name: Build team_a in isolation (partial build)
      run: bazel build //examples/team_a:docs

    - name: Build team_b in isolation (partial build)
      run: bazel build //examples/team_b:docs
