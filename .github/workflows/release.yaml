# Cuts a release when a version tag is pushed. See docs/dev/releasing.md.
#
# The GitHub release is created as a draft and published only once everything
# else succeeded, so a half-finished release never looks finished:
#
#   ci ─▶ release (draft) ─┬─▶ publish-bcr ─┬─▶ finalize (publish the draft) ─▶ docs
#                          └─▶ crates      ─┘
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    # https://github.com/bazel-contrib/.github/blob/master/.github/workflows/release_ruleset.yaml
    # It runs .github/workflows/release_prep.sh, which also refuses a tag that
    # disagrees with the versions the repository declares.
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      release_files: rinx-*.tar.gz
      bazel_test_command: "bazel build //:rinx"
      prerelease: false
      draft: true
      tag_name: ${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  publish-bcr:
    needs: release
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ github.ref_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  crates:
    needs: release
    runs-on: ubuntu-latest
    # Room for a release adding several new crates at one per ten minutes.
    timeout-minutes: 180
    permissions:
      contents: read
      # crates.io trusted publishing exchanges the workflow's OIDC token for a
      # short-lived publish token.
      id-token: write
    env:
      # Trusted publishing can only be enabled on a crate that exists, so the
      # very first release authenticates with a stored token instead.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # Installs the toolchain rust-toolchain.toml pins.
      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Authenticate with crates.io
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      # Publishes every crate in dependency order, skipping those already on
      # crates.io, so rerunning this job resumes a release that failed halfway,
      # and waiting out crates.io's limit on new crates (five at once, then one
      # every ten minutes). See scripts/publish_crates.py.
      - name: Publish to crates.io
        run: python3 scripts/publish_crates.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

  finalize:
    needs: [publish-bcr, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false

  # The release's documentation, published as vX.Y.Z/ beside the others and
  # made the one latest/ and the site's front page lead to. Last, so a release
  # that never became final never becomes the preferred version either.
  docs:
    needs: finalize
    uses: ./.github/workflows/pages.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: write
      # The benchmark sites the ci job uploaded earlier in this run.
      actions: read
