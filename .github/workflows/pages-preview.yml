# Publishes a pull request's documentation and example site as pr/<N>/ on the
# gh-pages branch, with the benchmark sites CI rendered under
# pr/<N>/benchmarks/, and links it from the pull request
# (docs/decisions/024-versioned-docs.md). pages-preview-cleanup.yml removes it
# when the pull request closes.
#
# CI builds the sites with the pull request's code and a read-only token, and
# uploads them. This workflow holds write access and therefore never checks out
# or runs the pull request's code: it copies static files. It is safe for a
# pull request from a fork for the same reason. The one thing it takes from the
# artifact besides the files, the pull request's number, it cross-checks: the
# pull request must be open and its head must be the commit CI built, so a run
# cannot publish over another pull request's preview, and a run that a newer
# push has overtaken publishes nothing.
name: Pages preview

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]

permissions: {}

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # gh-pages, the preview comment, and CI's artifact.
      contents: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
    # Tells "nothing to preview" (CI failed before the sites were built) from a
    # failure of this workflow. The benchmark sites are optional: a preview is
    # still worth publishing when a corpus failed to build.
    - name: Find the preview CI uploaded
      id: artifact
      run: |
        names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
          --jq '[.artifacts[].name]')
        found=$(jq 'index("preview") != null' <<<"$names")
        benchmarks=$(jq 'index("benchmarks") != null' <<<"$names")
        if [ "$found" != true ]; then
          echo "::notice::CI uploaded no preview; its site build probably failed."
        elif [ "$benchmarks" != true ]; then
          echo "::notice::CI uploaded no benchmark sites; publishing the preview without them."
        fi
        echo "found=$found" >> "$GITHUB_OUTPUT"
        echo "benchmarks=$benchmarks" >> "$GITHUB_OUTPUT"

    - uses: actions/download-artifact@v8
      if: steps.artifact.outputs.found == 'true'
      with:
        name: preview
        path: ${{ runner.temp }}/preview
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - uses: actions/download-artifact@v8
      if: steps.artifact.outputs.benchmarks == 'true'
      with:
        name: benchmarks
        path: ${{ runner.temp }}/benchmarks
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Check the pull request
      id: pr
      if: steps.artifact.outputs.found == 'true'
      run: |
        number=$(head -c 16 "$RUNNER_TEMP/preview/pr-number")
        if ! [[ "$number" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::The artifact names no pull request."
          exit 1
        fi
        read -r state head < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" \
          --jq '"\(.state) \(.head.sha)"')
        if [ "$state" != open ] || [ "$head" != "$HEAD_SHA" ]; then
          echo "::notice::#$number is $state at $head, not open at $HEAD_SHA; nothing to publish."
          echo "publish=false" >> "$GITHUB_OUTPUT"
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi
        echo "number=$number" >> "$GITHUB_OUTPUT"

    # A clone of the repository with push access, which the publisher turns
    # into a checkout of gh-pages.
    - uses: actions/checkout@v7
      if: steps.pr.outputs.publish == 'true'
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Publish pr/${{ steps.pr.outputs.number }}
      if: steps.pr.outputs.publish == 'true'
      env:
        NUMBER: ${{ steps.pr.outputs.number }}
        BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      run: |
        cp scripts/publish_pages.py "$RUNNER_TEMP/"
        python3 "$RUNNER_TEMP/publish_pages.py" publish \
          --pages-dir . \
          --base-url "$BASE_URL" \
          --slot "pr/$NUMBER" \
          --docs "$RUNNER_TEMP/preview/docs" \
          --examples "$RUNNER_TEMP/preview/examples" \
          --benchmarks-dir "$RUNNER_TEMP/benchmarks"

    # One comment per pull request, edited on every push rather than added to.
    - name: Link the preview from the pull request
      if: steps.pr.outputs.publish == 'true'
      env:
        NUMBER: ${{ steps.pr.outputs.number }}
        URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr/${{ steps.pr.outputs.number }}/
        BENCHMARKS: ${{ steps.artifact.outputs.benchmarks }}
      run: |
        benchmarks=""
        if [ "$BENCHMARKS" = true ]; then
          benchmarks=" · [benchmarks](${URL}benchmarks/index.html)"
        fi
        cat > "$RUNNER_TEMP/comment.md" <<EOF
        **Preview** of ${HEAD_SHA:0:7}: [documentation](${URL}docs/index.html) · [example site](${URL}example-site/examples/index.html)${benchmarks}

        GitHub Pages takes a minute or two to serve it. It is removed when this pull request closes.
        EOF
        gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
          --body-file "$RUNNER_TEMP/comment.md" --edit-last --create-if-none
