project = "Megacorp Documentation"
version = "v2.0-beta"

# Number every captioned figure, table and code block, and let `:numref:`
# show those numbers — Sphinx's `numfig`, off by default. See numref.rst.
numfig = true

# Named PlantUML preambles a diagram may ask for with `:config:`. The text of a
# preamble, not a path to one — a path baked into config would not survive a
# sandboxed build relocating the file (see docs/decisions/001-template-system.md).
[uml_configs]
monochrome = "skinparam monochrome true"

# The example site is published beside rinx's own documentation, once per
# version, so it shares that site's list of versions.
[version_switcher]
json_url = "https://nachstedt.github.io/rinx/versions.json"
