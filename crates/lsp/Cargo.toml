[package]
name = "rinx_lsp"
description = "The language server of rinx, served by `rinx lsp`. Internal to rinx; no stability guarantees."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true

[dependencies]
rinx_analyzer.workspace = true
rinx_ast.workspace = true
rinx_entity.workspace = true
rinx_index.workspace = true
rinx_parser.workspace = true
rinx_pyconf.workspace = true
rinx_renderer.workspace = true
rinx_toctree.workspace = true
anyhow = "1.0.102"
crossbeam-channel = "0.5"
lsp-server = "0.10"
lsp-types = "0.97"
pathdiff = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
# Without the default `fork`/`timeout` features, which spawn a process per case
# and are not needed for tests that cannot hang.
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
