[package]
name = "rinx_lsp"
description = "The language server of rinx, served by `rinx lsp`. Internal to rinx; no stability guarantees."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true

[dependencies]
rinx_ast.workspace = true
rinx_parser.workspace = true
anyhow = "1.0.102"
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"

[dev-dependencies]
# Without the default `fork`/`timeout` features, which spawn a process per case
# and are not needed for tests that cannot hang.
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
