[package]
name = "rusty_sphinx_renderer"
version = "0.1.0"
edition.workspace = true

[dependencies]
rusty_sphinx_ast = { path = "../ast" }
rusty_sphinx_filter = { path = "../filter" }
rusty_sphinx_entity = { path = "../entity" }
rusty_sphinx_index = { path = "../index" }
rusty_sphinx_toctree = { path = "../toctree" }
rusty_sphinx_scope = { path = "../scope" }
rusty_sphinx_uml = { path = "../uml" }
anyhow = "1.0.102"
html-escape = "0.2.13"
math-core = "0.8"
minijinja = "2"
octicons-pack = { version = "19.33", default-features = false }
pathdiff = "0.2.3"
# `default-features = false` + `ab_glyph` keeps every system font lookup out of
# the build — see `fonts/README.md`, which is also why a TTF is vendored.
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "ab_glyph"] }
serde = { version = "1", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "html", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
serde_json = "1"
toml = "0.8"

[lints]
workspace = true
