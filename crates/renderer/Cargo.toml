[package]
name = "rinx_renderer"
description = "Renders rinx documents to HTML. Internal to rinx; no stability guarantees."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true

[dependencies]
rinx_ast.workspace = true
rinx_filter.workspace = true
rinx_entity.workspace = true
rinx_index.workspace = true
rinx_toctree.workspace = true
rinx_scope.workspace = true
rinx_uml.workspace = true
anyhow = "1.0.102"
html-escape = "0.2.13"
math-core = "0.8"
minijinja = "2"
octicons-pack = { version = "19.33", default-features = false }
pathdiff = "0.2.3"
# `default-features = false` + `ab_glyph` keeps every system font lookup out of
# the build — see `fonts/README.md`, which is also why a TTF is vendored.
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "ab_glyph"] }
serde = { version = "1", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "html", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
rinx_inventory.workspace = true
serde_json = "1"
toml = "0.8"

[lints]
workspace = true
