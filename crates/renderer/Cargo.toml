[package]
name = "rusty_sphinx_renderer"
version = "0.1.0"
edition.workspace = true

[dependencies]
rusty_sphinx_ast = { path = "../ast" }
rusty_sphinx_index = { path = "../index" }
rusty_sphinx_toctree = { path = "../toctree" }
rusty_sphinx_scope = { path = "../scope" }
anyhow = "1.0.102"
html-escape = "0.2.13"
math-core = "0.8"
minijinja = "2"
pathdiff = "0.2.3"
serde = { version = "1", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "html", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
toml = "0.8"

[lints]
workspace = true
