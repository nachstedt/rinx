[package]
name = "rinx_entity"
description = "The entity meta-model (schemas of project-defined directives) for rinx. Internal to rinx; no stability guarantees."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true

[dependencies]
rinx_ast.workspace = true
regex = "1.10"
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
toml = "1.1"

[lints]
workspace = true

[dev-dependencies]
# `default-features = false` deliberately: the default set pulls in HTTP
# retrieval of remote `$ref`s, and with it rustls and the `aws-lc-rs` C
# toolchain. This schema has no remote references and validation runs offline
# in a sandbox, so that whole tree is cost with no benefit.
jsonschema = { version = "0.58.3", default-features = false }
